# Netlify hosts only the frontend. The API (FastAPI) must run elsewhere, e.g. Render via render.yaml.
# Replace BACKEND_URL below with your backend URL, e.g. https://artha.onrender.com
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
