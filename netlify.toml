# Netlify hosts the frontend. With no backend connected, the site runs as a read-only
# static demo on synthetic data (all demo personas can sign in).
# For the full app, deploy the FastAPI backend (e.g. Render via render.yaml) and uncomment
# the /api proxy below, replacing BACKEND_URL with its host (e.g. artha.onrender.com).
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# [[redirects]]
#   from = "/api/*"
#   to = "https://BACKEND_URL/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
